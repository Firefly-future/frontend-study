<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/banner.css">
</head>
<body>
    <!-- 后期可以使用swiper插件的结构 -->
    <!-- 装整个内容的大盒子swiper-container -->
    <div class="swiper-container banner4">
        <!-- 图片swiper-wrapper -->
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="./img/ban1.webp" alt=""></div>
            <div class="swiper-slide"><img src="./img/ban3.webp" alt=""></div>
            <div class="swiper-slide"><img src="./img/ban5.webp" alt=""></div>
            <div class="swiper-slide"><img src="./img/ban7.webp" alt=""></div>
        </div>
    </div>

    <script src="./js/banner.js"></script>
    <script>
        // 3 实例化对象 即 构建的实例 
        // 如淘宝的轮播 还是京东的轮播 还是苏宁的轮播等
        new Swiper({
            el : ".banner4"
        })
    </script>
</body>
</html>
