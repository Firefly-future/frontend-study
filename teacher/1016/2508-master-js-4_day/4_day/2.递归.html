    // 阶乘
    // 1 * 2 * 3 * 4 * 5
    function fn1(n) {
      if (n <= 1) return 1
      return n * fn1(n - 1)
    }

    // 求和
    // 1 + 2 + 3 + 4 + 5
    function fn2(n) {
      if (n <= 1) return 1
      return n + fn2(n - 1)
    }
