        // 把字符串‘get-element-by-id’ 改成getelemeNTBYID
        function changeFn(str){
            // 1 将字符串 按照-拆分数组  确保拿到每个单词
            str = str.split("-")
            var res = str[0] ; // 存储结果，先将不变的第一项进行存储
            // 2 因为第一个单词不变 所以从下标1开始循环遍历拿到每个单词
            for(var i = 1 ; i < str.length; i++){
                // 3 每个单词的后两个字符大写 即 先截取-2前面的小写 拼接-2后面的大写
                // 注意: slice 截取 支持负数 表示倒数几个  且不含结束
                // 注意; 这里只能使用slice截取，因为substr是个数截取，不支持负数，
                //       substring 是区间截取 虽然含头不含尾 但是不支持负数
                res += str[i].slice(0,-2) + str[i].slice(-2).toUpperCase()
            }
            return res
        }
        console.log( changeFn("get-element-by-id") )
