    <button id="btn">开始打字</button>
    <button id="paused">暂停</button>
    <div id="text"></div>

    <script src="./js/getEl.js"></script>
    <script>

        // 2 给开始按钮绑定点击事件

        //     // }

        // var res = "" , index = 0 ; 
        // $("btn").onclick = function(){

        //     var timer = setInterval(function(){
        //         if( index < str.length ){
        //             res += str[index]
        //             index++
        //             $("text").innerHTML = res
        //         }else{
        //             clearInterval( timer )
        //         }
        //     } , 50)
        // }

        var timer = null ; // 预留定时器
        var index = 0; // 打印的开始下标
        $("btn").onclick = function(){
            // 获取打印的内容 和 事件
            var str = $("str").value.trim() ,
                time = $("time").value ;
            if( !str ) return alert("打印的内容不能为空");

            if( index === str.length - 1 ) {
                index = 0;
                $("text").innerHTML = ""
            }
            // this 在事件程序中 指向绑定事件的元素
            // console.log(this)
            this.disabled = true;
            $("text").innerHTML += index > 0 ? '' : str[index];
            // 开启定时器 按照指定的时间执行访问下一个字符
            timer = setInterval(function(){
                index++
                // 判断已经是最后一个字符 将停止打印
                if( index >= str.length - 1 ){ 
                    clearInterval( timer ) 
                    // console.log( this )  //window
                    $("btn").disabled = false;
                }
                $("text").innerHTML += str[index];
            },time)
        }

        $("paused").onclick = function(){
            clearInterval( timer ) 
            // console.log( this )  //window
            $("btn").disabled = false
        }
    </script>
</body>
