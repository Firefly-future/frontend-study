<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var arr = [ [15,9,6],["a","b"],[true , "hello"] ];  // [ 15,9,6,"a","b",true , "hello" ]
        //              0        1           2
        //           0  1  2
        function twoChangeOneArr( arr ){
            var resArr = [];  // 结果数组
            // concat  或  push
            // concat 拿到每个子数组 合并
                // for( var i = 0 ; i < arr.length; i++ ){
                //     // console.log( arr[i] )
                //     resArr = resArr.concat( arr[i] )
                // }
                // return resArr
            // push 拿到子数组中的每一项 添加
            for( var i = 0 ; i < arr.length; i++ ){
                // console.log( arr[i] )
                for( var j = 0 ; j < arr[i].length; j++){
                    resArr.push(arr[i][j])
                }
            }
            return resArr
        }
        console.log( twoChangeOneArr( arr ) )
        
    </script>
</body>
</html>
