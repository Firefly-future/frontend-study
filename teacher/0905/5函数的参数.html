        function createColspan( r ){
            document.write("<li>")
            // 循环生成列数 span  规律: 列再跟随行r变
            for( var c = 1 ; c <= r ; c++ ){
                document.write("<span>" + c +  " * " + r + " = " + r * c + "</span>")
            }
            document.write("</li>")
