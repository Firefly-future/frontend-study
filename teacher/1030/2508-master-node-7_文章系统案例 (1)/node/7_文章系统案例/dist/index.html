<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./axios.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">文章管理系统</div>
    <div class="info">
      <div class="user">欢迎，<span></span></div>
      <button class="logout">退出登陆</button>
    </div>
  </header>
  <nav>
    <span class="active">文章列表</span>
    <span>发布文章</span>
  </nav>
  <main>
    <div class="tab-content show articles">
      <div class="empty">
        <p>还没有文章数据，快去创建文章吧</p>
      </div>
      <div class="list"></div>
    </div>
    <div class="tab-content publish">
      <h4>文章标题</h4>
      <input class="article-title" type="text">
      <h4>文章内容</h4>
      <textarea class="article-content" name="" id=""></textarea>
      <button>发布文章</button>
    </div>
  </main>



  <script src="./index.js"></script>
</body>
</html>
