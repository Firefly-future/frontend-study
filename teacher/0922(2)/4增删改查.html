<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/4.css">
</head>
<body>
    <div class="box">
        <div class="tit">使用Jquery实现表格内数据的添加、删除、修改、查找</div>
        <div class="header">
            姓名: <input type="text" placeholder="请输入姓名" class="inp">
            <button class="search">查询</button>
            <button class="reset">重置</button>
        </div>
        <span class="addBtn">添加</span>

        <table>
            <thead>
                <tr>
                    <th>收货人</th>
                    <th>所在地区</th>
                    <th>详细地址</th>
                    <th>邮编</th>
                    <th>电话/手机</th>
                    <th>操作</th>
                    <th>设置</th>
                </tr>
            </thead>

            <tbody>
                <!-- <tr>
                    <td>曾小贤</td>
                    <td>光鼎盛保持经济</td>
                    <td>v成功获得是就传递给手术成功v传递函数</td>
                    <td>510000</td>
                    <td>186515615632</td>
                    <td><span>编辑</span><span>删除</span><span>上移</span><span>下移</span></td>
                    <td>设为默认</td>
                </tr> -->
            </tbody>
        </table>
    </div>
    <!-- 遮罩 -->
    <div class="mark">
        <div class="con">
            <div class="head">
                <h4 class="subhead">添加/编辑操作</h4>
                <span class="close">&times;</span>
            </div>

            <div class="info">
                <p>
                    <label for="">收货人:</label>
                    <input type="text" class="user">
                </p>
                <p>
                    <label for="">所在地:</label>
                    <input type="text" class="area">
                </p>
                <p>
                    <label for="">详细地址:</label>
                    <input type="text" class="address">
                </p>
                <p>
                    <label for="">邮编:</label>
                    <input type="number" class="code">
                </p>
                <p>
                    <label for="">电话:</label>
                    <input type="number" class="tel">
                </p>
            </div>

            <div class="btns">
                <button class="no">取消</button>
                <button class="ok">确认</button>
            </div>
        </div>
    </div>
    <script src="./js/data.js"></script>
    <script src="./js/4.js"></script>
</body>
</html>
