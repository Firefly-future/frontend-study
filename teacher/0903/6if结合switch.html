<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">查询成绩分数评价</button>
    <script>
        // 需求:
            // 点击页面中的 查询成绩分数评价 按钮
            // 弹出输入框 要求用户输入成绩
            // 如果用户取消 提示 用户拒绝了此操作
            // 如果用户没有输入  提示内容不能为空
            // 如果用户输入的不是数字  提示 请输入数字
            // 如果输入的数字超出1-100的范围 提示成绩无效
            // 判断用户输入的成绩 属于 那个区间  根据不同的区间 进行评价
            // 1-59   小趴菜 干啥啥不行
            // 60-69  完美擦肩 跨过及格线
            // 70-79  一般 中不溜秋
            // 80-89  良好 像90看齐
            // 90-99  优秀 怕自己太完美
            // 100    小小100拿下 天花板

        // 1 获取按钮
        var btn = document.getElementById("btn");
        // console.log( btn )
        // 2 给按钮绑定点击事件
        // 绑定事件的语法:
            // el.on+事件类型 = function(){ 执行代码 }
            // click 点击事件 
        btn.onclick = function(){
            // 弹出输入框 要求用户输入成绩
            var score = prompt("请输入成绩");
            // 如果用户取消 提示 用户拒绝了此操作
            if( typeof score === "object" ){
                alert("用户拒绝了此操作")
            // 如果用户没有输入  提示内容不能为空
            }else if( score === "" ){
                alert("提示内容不能为空")
            // 如果用户输入的不是数字  提示 请输入数字
            }else if( isNaN( score ) ){
                alert("请输入数字")
            // 如果输入的数字超出1-100的范围 提示成绩无效
            }else if( score < 1 || score > 100 ){
                alert("提示成绩无效")
            }else{
                // 判断用户输入的成绩 属于 那个区间  根据不同的区间 进行评价
                // 1-59   小趴菜 干啥啥不行
                // 60-69  完美擦肩 跨过及格线
                // 70-79  一般 中不溜秋
                // 80-89  良好 像90看齐
                // 90-99  优秀 怕自己太完美
                // 100    小小100拿下 天花板
                switch( parseInt( score / 10 ) ){
                    case 6 :
                        alert("完美擦肩 跨过及格线")
                    break ;

                    case 7 :
                        alert("一般 中不溜秋")
                    break ;

                    case 8 :
                        alert("良好 像90看齐")
                    break ;

                    case 9 :
                        alert("优秀 怕自己太完美")
                    break ;

                    case 10 :
                        alert("小小100拿下 天花板")
                    break ;

                    default :
                        alert("小趴菜 干啥啥不行")
                    break ;
                }
                
            }
        }
        // 根据以下数字可得出 规律如下
        // 十位数一致的是一个区间  考虑如何拿到十位上的数字
        //   即  65 / 10 = 6.5 取整
        // 60 61 62 63 64 65 66 ... 69
        // 70 71 72                 79
    </script>
</body>
</html>
