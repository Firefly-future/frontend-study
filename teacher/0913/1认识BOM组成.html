<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // BOM 是什么？
        //     ● BOM 全称是 浏览器对象模型（Browser Object Model） ， 
        //       浏览器实现的供 JavaScript 程序调用的一组对象
        // BOM 组成部分
            // 1. window 对象
                // ○ 功能：表示浏览器的一个窗口或框架，是BOM的核心对象，包含了文档对象（DOM）。
            // 2. location 对象
                // ○ 功能：提供有关当前URL的信息，并允许JavaScript修改浏览器的URL。
            // 3. history 对象
                // ○ 功能：当前浏览器的历史记录信息，包含用户在浏览器窗口中访问过的URL。
            // 4. navigator 对象
                // ○ 功能：包含关于浏览器自身的信息，如浏览器的名称、版本等。
            // 5. screen 对象
                // ○ 功能：提供关于用户屏幕的相关信息。
            // 6. document 对象
                // ○ 功能：当前页面文档相关信息，可以操作页面上的元素。
    </script>
</body>
</html>
