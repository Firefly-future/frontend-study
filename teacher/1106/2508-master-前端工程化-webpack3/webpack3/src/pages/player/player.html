<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="bg"></div>

  <div class="song-wrap">
    <div class="song-disc-wrap">
      <div class="song-disc pause">
        <img alt="">
      </div>
      <div class="play-icon">
        <img class="m-song-disk-play" src="https://p6.music.126.net/obj/wonDlsKUwrLClGjCm8Kx/34207669669/f020/7908/a749/34315097c835773c4e003e72fbbae607.png">
      </div>
    </div>
  </div>
  <div class="song-info">
    <div class="song-info-box">
      <div class="song-title-box">
        <div class="song-name">
          <b></b>
          <span></span>
        </div>
        <div class="song-singer"></div>
      </div>
      <div class="liked">
        <img class="image" src="https://p5.music.126.net/obj/wonDlsKUwrLClGjCm8Kx/34185429084/3f1f/9f48/8283/b280e70992f990c78fc7219860e42baa.png">
        <span></span>
      </div>
      <div class="comment">
        <img class="image" src="https://p5.music.126.net/obj/wonDlsKUwrLClGjCm8Kx/34185427417/5b4d/c1b5/0d71/6863eb61cfe5f6218de37af944d64aee.png">
        <span></span>
      </div>
    </div>
    <div class="lyric-wrap">歌词</div>
    <div class="controller">
      <div class="playback-rate">倍速：<span>1</span></div>
    </div>
    <div class="progress">
      <div class="time current">00:00</div>
      <div class="line">
        <div class="hl-line">
          <i></i>
        </div>
      </div>
      <div class="time duration">00:00</div>
    </div>
  </div>
  <audio></audio>
</body>
</html>
