  <h2>详情页面</h2>
  <div class="box"></div>
  <ul></ul>
  <script>

    const request = (
      url,
      {
        method = 'GET',
        data = null,
        headers = {},
        onSuccess,
        onFail
      } = {}
    ) => {
      const xhr = new XMLHttpRequest()
      xhr.open(method, url)
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            const data = JSON.parse(xhr.responseText)
            onSuccess && onSuccess(data)
          } else {
            onFail && onFail()
          }
        }
      }
      if (headers) {
        Object.keys(headers).forEach(key => {
          xhr.setRequestHeader(key, headers[key])
        })
      }
      xhr.send(data)
    }


    // 回调函数：嵌套多层会有回调地狱的问题
