<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }
  /* 
    px 固定像素
    em 1em === 当前元素的字体大小
    rem 1rem === html 的font-size
    vw 100vw === 可视区域的宽度
    vh 100vh === 可视区域的高度
  */
  html {
    /* 使用 vw 计算rem */
    font-size: calc(100vw / 375 * 10);
  }
  .parent {
    font-size: 20px;
    overflow: hidden;
  }
  .box {
    width: 30rem;
    height: 30rem;
    background: red;
    font-size: 10px;
    float: left;
  }
  .right {
    float: right;
    width: 7.5rem;
    height: 7.5rem;
    background: green;
  }
</style>
<body>
  <div class="parent">
    <div class="box">元素字体大小</div>
    <div class="right"></div>
  </div>

</html>
