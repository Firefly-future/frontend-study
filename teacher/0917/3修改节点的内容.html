<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <p>哈哈</p>
    </div>
    <script>
        var box =  document.querySelector(".box");
        // 修改节点的内容
        //     ● 修改文本内容（不会解析字符串内的标签）：element.textContent = 'new text'(识别换行的空白文本)
                    // box.textContent = `<p>嘿嘿</p>`
                    console.log( box.textContent.length )
        //     ● 修改HTML内容：element.innerHTML = '<b>new content</b>'

        //     ● 修改文本内容（不会解析字符串内的标签）：element.innerText = 'new text'(不识别换行的空白文本)
                    console.log( box.innerText.length )
                    box.innerText = `<h3>标题</h3>`
    </script>
</body>
</html>
