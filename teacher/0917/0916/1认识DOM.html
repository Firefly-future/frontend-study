<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // ● DOM 全称是 文档对象模型（Document Object Model），
        //      允许 JavaScript 程序动态地访问和更新文档的内容、结构和样式。
        // ● DOM 包含了所有 HTML 元素的属性和方法，
        //      将 HTML 文档转换为一个由节点和对象组成的数据结构【DOM树】，
        //      使得开发者可以使用JavaScript来操作页面内容
        // 节点
            // 什么是节点？
            // ● HTML中所有的元素都是一个节点
            // ● 整个文档是文档节点
            // ● 所有的标签都是元素节点
            // ● 标签内的属性是属性节点
            // ● 标签内的文本是文本节点
            // ● 标注信息就是注释节点

        // 节点类型
            // ● 文档节点（document）：整个文档的根节点。
            // ● 元素节点：代表文档中的HTML元素，如<div>, <p>, <a>等。。
            // ● 文本节点：元素中的文本内容。
            // ● 属性节点：元素节点上的属性，如class, href, id等。
            // ● 注释节点：文档的注释部分。
    </script>
</body>
</html>
