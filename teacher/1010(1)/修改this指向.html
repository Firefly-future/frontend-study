<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span class="el">嘿嘿</span>
    <script>
        // 修改this指向
            // call(this , 参数1 , 参数2...)    修改this指向 且立即执行函数
            // apply(this , [参数1 , 参数2...])   修改this指向 且立即执行函数
            // bind(this)(参数1 , 参数2...)    修改this指向 不会立即执行函数   
                                        //     返回绑定this的新函数
                                        //     this是永久的,无法通过call或apply方法再次更改

        var el = document.querySelector(".el");
        function fn( a,b,c ){
            console.log(this)
            console.log( a,b,c )
        }
        // window.fn()  // window  undefined * 3

        var obj = {
            animal : "tiger",
            age : 2 ,
            say : function(){
                console.log(this)
            }
        }
        // obj.say() // obj

        var people = {
            user : "张三" ,
            age : 15
        }
        window.fn.call(obj , 1,2,3);  // obj  1 2 3
        window.fn.apply(people , ["a","b","c"])  // people  a b c
        // var fn = window.fn.bind(obj)  // 绑定obj 返回新函数
        // fn("china" , 45 , true) // obj 
        // console.log( fn )

        window.fn.bind(el)("x","e","a")

    </script>
</body>
</html>
