<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1 行内js
            写在标签上的js
    -->
    <button onclick="alert('hello')">戳我弹出hello</button>
    <!-- 解析; onclick 是点击事件
               alert() 弹出 括号内弹出的内容需要写在引号内 -->

    <!-- 2 内嵌js
            写在script标签内 该标签写在</body>的前面 -->
    <script>
        // 弹出 谜一样的js
        alert("谜一样的js")
    </script>

    <!-- 3 外部js 【推荐】
            使用script标签的src属性 引入外部js文件
            该标签写在</body>的前面
    -->
    <script src="./js/2.js"></script>
</body>
</html>
