<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 三种输出方式
        //     1. 打印在控制台: console.log(xxx);     用于开发人员查错
                // -> 如 控制台 打印用户的手机号;
                    var tel = 15965417777;  // 1 先声明tel变量 存储用户的手机号
                    console.log( tel )      // 2 打印再控制台


        //     2. 弹出框: alert(xxx);

        //     3. 输出到页面: document.write(xxx);
                // -> 如 再页面中输出 好好学习  天天向上
                document.write("好好学习,天天向上")

                // -> 如再页面中输出 1号标题 且内容是 good good study   day day up
                document.write("<h1>good good study   day day up</h1>")


        // js的注释 占比整个js权重的35%-40%
                // 注释的内容是不会被浏览器解析，是一个解释说明的信息，只是提供给程序员看

                //    // 单行注释
                //   /*  */  多行注释
    </script>
</body>
</html>
