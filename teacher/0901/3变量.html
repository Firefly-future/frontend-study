<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 变量
            // 1 概念: 存储单个可变信息的容器

            // 2 声明:  var 关键字

            // 3 语法:  var name 

            // 4 变量声明方式
                // 4.1 先声明 再赋值 -> 如 存储用户的年龄
                    // var userAge ;   // 先声明一个userAge变量 用于存储年龄
                    // userAge = 18;   // 给变量赋值 为用户的实际年龄
                    // alert( userAge ) // 将用户的年龄 弹出

                // 4.2 声明和赋值同时进行 -> 如 存储用户的邮编
                    // var userZipCode = 10091 ;
                    // alert( userZipCode )

                // 4.3 一次声明多个变量用 逗号 隔开  如 存储用户的地址 和 用户的性别
                    // var userAddress = "北京市海淀区永丰智慧谷C2座" ,
                    //     userSex = "女" ;
                    // alert( userSex )
                    // alert( userAddress )
            // 5 变量的命名规则
                // 1. 可包含字母、数字和下划线“_”和美元符“$”。
                // 2. 名称不能以数字开头，不能以汉字命名。
                // 3. 不能使用 JavaScript 的关键字和保留字（如var、if、else、for等）。
                // 4. 变量名严格区分大小写，例如，myname 和 myName 是两个不同的变量。
                    // var var = 18;   
                    // Unexpected token 'var' (at 3变量.html:34:21)
                    // 出乎意料的  标志   var
               
            // 6 总结: 变量声明未赋值，结果是undefined
            //         变量本身没有数据类型, 类型与它赋的值有关

    </script>
</body>
</html>
