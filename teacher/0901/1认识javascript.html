        发展背景
            布兰登·艾奇（Brendan Eich，1961年～），1995年在网景公司，发明的JavaScript。一开始JavaScript叫做LiveScript，但是由于当时Java这个语言特别火，所以为了傍大牌，就改名为JavaScript。


        JavaScript  和  ECMAScript的关系
            简单来说 ECMAScript 不是一门语言，而是一个标准。符合这个标准的比较常见的有：
                ● JavaScript：浏览器端运行
                ● NodeJs：服务器端运行
            总结: ECMAScript 是一个标准，JavaScript 是根据该标准的实现


        JavaScript 的作用
            1. 三层Web开发结构
                a. HTML：结构层，构成网页的骨架和内容
                b. CSS：表现层，定义网页的样式和布局
                c. JavaScript：行为层 ，负责网页的行为和交互性，如操作DOM、响应事件
            2. javascript 的功能
            a. 与HTML的协作：动态内容和交互性
                ■ 动态内容：JavaScript可以读取和修改HTML内容，允许在网页加载后动态地改变文本、图片等元素。
                ■ 用户交互：处理用户事件（如点击、滚动、键盘输入），并根据这些交互来更改页面内容或行为。
            b. 与CSS的协作：动态样式和动画
                ■ 样式控制：JavaScript能够实时更改元素的CSS样式，使网页能够响应用户操作或其他事件来改变外观。
                ■ 动画和视觉效果：使用JavaScript来创建复杂的动画和视觉效果，这在纯CSS中难以实现。
            3. javascript 组成部分（重要）
                a. ECMAScript 核心语法：主要规定了一些 javascript 的语法规范。
                b. BOM：浏览器对象模型，提供了访问浏览器的一些接口。
                c. DOM：文档对象模型，提供访问页面的接口。
     -->
