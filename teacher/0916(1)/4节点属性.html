<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <a href="#">超链接</a>
        <p>段落</p>
        <span>特殊文本</span>
        <h2>2号标题</h2>
        <ul>
            <li>无序列表项</li>
            <li>无序列表项</li>
            <li><!--无序列表项--></li>
        </ul>
    </div>
    <script>
        // 节点属性
            //      节点          nodeName节点名称            nodeType节点类型           nodeValue节点值

            //     元素节点           大写标签名                     1                         null
            //     属性节点            属性名                        2                         属性值
            //     文本节点             #text                        3                       文本内容
            //     注释节点            #comment                      8                       注释内容
            //     文档节点            #document                     9                          null

        var box = document.querySelector(".box");

        console.log(`元素节点名称是${box.nodeName};节点类型是${box.nodeType};节点值是${box.nodeValue}`)

        var aText = box.firstElementChild.firstChild;
        console.log(`文本节点名称是${aText.nodeName};节点类型是${aText.nodeType};节点值是${aText.nodeValue}`)

        var attr = box.attributes[0];
        console.log(`属性节点名称是${attr.nodeName};节点类型是${attr.nodeType};节点值是${attr.nodeValue}`)

        var zs = box.lastElementChild.lastElementChild.firstChild;
        console.log(`注释节点名称是${zs.nodeName};节点类型是${zs.nodeType};节点值是${zs.nodeValue}`)

        console.log(`文档节点名称是${document.nodeName};节点类型是${document.nodeType};节点值是${document.nodeValue}`)


        // 周考  18  判断函数参数 el 是否为元素节点  是返回true  不是false
        function isElement(el){
            return el.nodeType === 1 ? true : false
        }
        console.log( isElement( box ) )
        console.log( isElement( aText ) )
    </script>
</body>
</html>
