<!DOCTYPE html>

<body>
    <div class="wrap">
        <div class="dayDate">
            今天日期

        <div class="taskCountTab">

            <div class="tabs">
                <span class="All">All</span>
                <span class="Active">Active</span>
                <span class="Completed">Completed</span>
            </div>
        </div>

        <input type="text" placeholder="Add a new task..." class="taskName">

        <div class="taskCon">
            <!-- 每一个任务 -->

                <input type="checkbox">
                <strong>任务名称</strong>
                <span>&times;</span>
            </p>

            <p>
                <input type="checkbox">
