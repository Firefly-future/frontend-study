<body>
    <script>
        // 三元运算符
            // 语法: 表达式1[条件语句] ? 表达式2[真执行代码] : 表达式3[假执行代码]

            // 需求: 判断 true + 5 >= 5 条件为真 弹出yes   否则打印no
            
            true + 5 >= 8 ? alert("yes") : console.log("no")
    </script>
</body>
</html>
