<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  body {
    background: #ccc;
  }
  canvas {
    background: #FFF;
  }
</style>
<body>
  <canvas width="600" height="500"></canvas>


  <script>
    const cvs = document.querySelector('canvas')
    const ctx = cvs.getContext('2d')
    console.log(ctx)

    ctx.beginPath()
    ctx.moveTo(100, 100)
    ctx.lineTo(200, 100)
    ctx.lineTo(200, 200)
    // ctx.closePath()
    ctx.strokeStyle = '#ff0000'
    ctx.lineWidth = 10
    ctx.lineCap = 'round'
    ctx.lineJoin = 'round'
    ctx.stroke()
    ctx.fillStyle = 'green'
    ctx.fill()
    

    ctx.lineWidth = 1
    ctx.beginPath()
    ctx.moveTo(300, 0)
    ctx.lineTo(300, 500)
    ctx.stroke()

    ctx.beginPath()
    ctx.moveTo(0, 250)
    ctx.lineTo(600, 250)
    ctx.stroke()


    ctx.fillStyle = 'hotpink'
    ctx.fillRect(350, 100, 100, 80)
    ctx.clearRect(400, 120, 50, 30)

    // 计算弧度
    const angle = n => Math.PI / 180 * n
    // // 绘制圆形
    // ctx.beginPath()
    // ctx.moveTo(300, 250)
    // ctx.arc(300, 250, 100, 0, angle(60))
    // ctx.closePath()
    // ctx.strokeStyle = 'blue'
    // ctx.stroke()
    // ctx.fill()

    ctx.beginPath()
    ctx.arc(250, 300, 50, 0, angle(360))
    ctx.fill()

    ctx.strokeStyle = 'blue'
    ctx.beginPath()
    ctx.moveTo(0, 250)
    ctx.lineTo(250, 250)
    ctx.arcTo(300, 250, 300, 300, 50)
    ctx.lineTo(300, 500)
    ctx.stroke()

    ctx.fillStyle = '#000'
    ctx.font = '20px normal'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText('我是一段文字', 300, 250)


    const img = new Image()
    img.src = './img2.jpg'
    img.onload = () => {
      ctx.drawImage(img, 300, 250, 100, 100)
    }
    
  </script>
</body>
</html>
