<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/乘法表.css">
</head>
<body>
    <script>
        function pow(){
            document.write('<ul>')
                for(var i=1;i<10;i++){
                    document.write('<li>')
                        for(var j=1;j<=i;j++){
                            document.write('<span>'+i+'*'+j+'='+i*j+'</span>')
                        }document.write('</li')
                }
                document.write('</ul>')
        }
        pow()
    </script>
</body>
</html>
