<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <div class="box1">
            <h2>popup.alert</h2>
            <button class="tit">默认标题</button>
            <button class="con">自定义标题 自定义内容</button>
        </div>
        <div class="box2">
            <h2>popup.confirm</h2>
            <button class="btn">默认按钮</button>
            <button class="event">自定义按钮 自定义事件</button>
        </div>
        <div class="box3">
            <h2>popup.msg</h2>
            <button class="set">默认样式 2s后自动关闭</button>
            <button class="pic">设置图标</button>
            <button class="close">自定义关闭时间</button>
        </div>
        <div class="box4">
            <h2>popup.loading</h2>
            <button class="load">展示loading</button>
        </div>
    </div>
    <script src="./js/class面向对象.js"></script>
</body>
</html>
