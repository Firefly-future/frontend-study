<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/周测.css">
</head>
<body>
    <h2>popup alert</h2>
    <button class="alert btn1">默认标题 默认内容</button>
    <button class="alert btn2">自定义标题 自定义内容</button>
    <h2>popup confirm</h2>
    <button class="confirm btn1">默认按钮</button>
    <button class="confirm btn2">自定义事件按钮</button>
    <h2>popup msg</h2>
    <button class="msg btn1">默认样式</button>
    <button class="msg btn2">自定义图标</button>
    <button class="msg btn3">自定义关闭时间</button>
    <h2>popup load</h2>
    <button class="show-loading">展示loading</button>
    <!-- <div class="loading">
        <div class="load"></div>

    <script src="./js/周测.js"></script>
