<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {
            width: 3rem;
            height: 3rem;
            background: red;
            float: left;
        }

        .box2 {
            width: 1rem;
            height: 1rem;
            background: green;
            float: right;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="box2"></div>




    <script>
        const resize = () => {
            const scale = document.documentElement.clientWidth / 375
            document.documentElement.style.fontSize = scale * 10 + 'px'
        }
        resize()
        window.onresize = resize
    </script>
</body>

</html>
