<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /*左浮动固定宽度，右边盒子overflow:hidden触发bfc，使其不与浮动盒子区域重叠，因此会重新计算宽度。*/
    .container1 .left {
        float: left;
        width: 100px;
    }

    .container1 .right {
        overflow: hidden;
    }

    /*清除浮动*/
    .container1:after {
        content: "";
        height: 0;
        line-height: 0;
        display: block;
        visibility: hidden;
        clear: both;
    }

    /*左浮动固定宽度,右边margin-left*/
    .container2 .left {
        float: left;
        width: 100px;
    }

    .container2 .right {
        margin-left: 100px;
    }

    /*清除浮动*/
    .container2:after {
        content: "";
        height: 0;
        line-height: 0;
        display: block;
        visibility: hidden;
        clear: both;
    }

    .container3 {
        position: relative;
    }

    .container3 .left {
        position: absolute;
        left: 0px;
        top: 0px;
        width: 100px;
    }

    .container3 .right {
        margin-left: 100px;
    }

    /*双display:inline-block*/
    .container4 {
        font-size: 0;
    }

    .container4 .left {
        width: 100px;
    }

    .container4 .left,
    .container4 .right {
        display: inline-block;
        font-size: 16px;
        vertical-align: top;
    }

    .container4 .right {
        width: calc(100% - 100px);
    }

    .container5 {
        display: table;
    }

    .container5 .left,
    .container5 .right {
        display: table-cell;
    }

    .container6 {
        display: flex;
    }

    .container6 .right {
        flex-grow: 1;
    }
</style>

<body>
    <div class="container1">
        <div class="left">
            我是左盒子
        </div>
        <div class="right">
            我是右盒子
        </div>
    </div>
    <div class="container2">
        <div class="left">
            我是左盒子
        </div>
        <div class="right">
            我是右盒子
        </div>
    </div>
    <div class="container3">
        <div class="left">
            我是左盒子
        </div>
        <div class="right">
            我是右盒子
        </div>
    </div>
    <div class="container4">
        <div class="left">
            我是左盒子
        </div>
        <div class="right">
            我是右盒子
        </div>
    </div>
    <div class="container5">
        <div class="left">
            我是左盒子
        </div>
        <div class="right">
            我是右盒子
        </div>
    </div>
    <div class="container6">
        <div class="left">
            我是左盒子
        </div>
        <div class="right">
            我是右盒子
        </div>
    </div>
</body>

</html>
