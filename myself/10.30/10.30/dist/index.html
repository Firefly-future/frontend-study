<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <link rel="stylesheet" href="./index.css">

<body>
    <header>
        <div class="logo">文档操作系统</div>

        <div class="tab-content active article">文章列表</div>
        <div class="tab-content publish">发布文章</div>
    </nav>
    <main>
        <div class="tab show article">
            <div class="list"></div>
        </div>
        <div class="tab publish">
             <h4>标题</h4>
             <input type="text" class="title">
             <h4>文章内容</h4>
