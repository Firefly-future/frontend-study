<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <link rel="stylesheet" href="./css/2.css">
</head>
<body>
    <div class="swiper-container tu">
        <div class="swiper-wrapper">

            <div class="swiper-slide"><img src="https://img0.baidu.com/it/u=894097787,217968889&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=889" alt=""></div>
            <div class="swiper-slide"><img src="https://img2.baidu.com/it/u=665897025,2998019730&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=889" alt=""></div>
            <div class="swiper-slide"><img src="https://img1.baidu.com/it/u=3685651703,1063280447&fm=253&fmt=auto?w=608&h=808" alt=""></div>

        new Swiper({

            wait:2000,
            speed:1000

</html>
