<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0;padding: 0;box-sizing: border-box; }
        #ind:hover{color: red;cursor: pointer;}
    </style>
</head>
<body>
    <h1>尊敬的用户<span id="name">xxx</span>,恭喜你注册成功了！<br>
        快去登录吧！<span id="ind">登录</span>
    </h1>
    <script src="../js/获取元素函数.js"></script>
    <script>
        // 解密 decodeURIComponent
        // 加密 encodeURIComponent
        var url=decodeURIComponent(location.search).slice(1);
        $('name').innerHTML=getUserInfo(url,'user')
        // 封装函数得到需要的信息key属性
        function getUserInfo(str,key){
            var res='';
            str=str.split('&')
            console.log(str)
            str.forEach(function(everyInfo){
                everyInfo=everyInfo.split(':')
                if(key===everyInfo[0])res=everyInfo[1]
            })
            return res
        }
    </script>
</body>
</html>
