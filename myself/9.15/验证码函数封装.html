<body>
    <script>
        var str='0123456789qwertyuiopasdfghjklzxcvbnmQWERTYUIOPASDFGHJKLZXCVBNM'
        function yanzhengma(str){
            var code=''
            for(var i=0;i<4;i++){
                var index=Math.floor(Math.random()*str.length)
                code+=str[index]
            }return code
        }
        console.log(yanzhengma(str))
    </script>
</body>
