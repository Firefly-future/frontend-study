<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>音乐列表 - 无限滚动</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f7f7;
      color: #333;
      line-height: 1.5;
    }
    
    .music-list-container {
      height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .music-item {
      padding: 12px 16px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
    }
    
    .music-item .cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background-color: #eee;
      margin-right: 12px;
      flex-shrink: 0;
    }
    
    .music-item .info {
      flex-grow: 1;
      overflow: hidden;
    }
    
    .music-item .title {
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .music-item .artist {
      font-size: 14px;
      color: #888;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .loading-indicator {
      padding: 15px;
      text-align: center;
      color: #999;
      font-size: 14px;
      display: none;
    }
    
    .no-more {
      padding: 15px;
      text-align: center;
      color: #999;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="music-list-container" id="musicListContainer">
    <div id="musicList"></div>
    <div id="loadingIndicator" class="loading-indicator">加载中...</div>
    <div id="noMoreIndicator" class="no-more">没有更多了</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const musicListContainer = document.getElementById('musicListContainer');
      const musicList = document.getElementById('musicList');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const noMoreIndicator = document.getElementById('noMoreIndicator');
      
      let isLoading = false;
      let currentPage = 0;
      const pageSize = 10;
      const loadThreshold = 100;
      let hasMore = true;
      
      // 模拟音乐数据
      const mockMusicData = (function() {
        const titles = [
          "夏天的风", "夜曲", "晴天", "七里香", "简单爱", 
          "稻香", "告白气球", "青花瓷", "双截棍", "安静",
          "东风破", "菊花台", "发如雪", "珊瑚海", "千里之外"
        ];
        const artists = [
          "周杰伦", "林俊杰", "陈奕迅", "五月天", "孙燕姿",
          "蔡依林", "王力宏", "张惠妹", "梁静茹", "邓紫棋"
        ];
        
        return function(page, size) {
          const start = page * size;
          const data = [];
          for (let i = 0; i < size; i++) {
            const idx = start + i;
            if (idx >= 50) return data; // 模拟总共50首歌
            
            data.push({
              id: idx,
              title: titles[idx % titles.length] + (idx > titles.length ? ` (${Math.floor(idx/titles.length)+1})` : ''),
              artist: artists[idx % artists.length],
              coverColor: `hsl(${idx * 10 % 360}, 70%, 80%)`
            });
          }
          return data;
        };
      })();
      
      // 渲染音乐列表
      function renderMusicItems(items) {
        items.forEach(item => {
          const itemElement = document.createElement('div');
          itemElement.className = 'music-item';
          itemElement.innerHTML = `
            <div class="cover" style="background-color: ${item.coverColor}"></div>
            <div class="info">
              <div class="title">${item.title}</div>
              <div class="artist">${item.artist}</div>
            </div>
          `;
          musicList.appendChild(itemElement);
        });
      }
      
      // 加载更多音乐
      function loadMoreMusic() {
        if (isLoading || !hasMore) return;
        
        isLoading = true;
        loadingIndicator.style.display = 'block';
        
        // 模拟网络请求延迟
        setTimeout(() => {
          const newItems = mockMusicData(currentPage, pageSize);
          
          if (newItems.length === 0) {
            hasMore = false;
            noMoreIndicator.style.display = 'block';
            loadingIndicator.style.display = 'none';
            return;
          }
          
          renderMusicItems(newItems);
          currentPage++;
          isLoading = false;
          loadingIndicator.style.display = 'none';
        }, 800);
      }
      
      // 检查是否滚动到底部附近
      function checkScrollPosition() {
        const { scrollTop, scrollHeight, clientHeight } = musicListContainer;
        const distanceToBottom = scrollHeight - (scrollTop + clientHeight);
        
        if (distanceToBottom < loadThreshold) {
          loadMoreMusic();
        }
      }
      
      // 添加滚动事件监听（带节流）
      let isThrottled = false;
      musicListContainer.addEventListener('scroll', () => {
        if (!isThrottled) {
          checkScrollPosition();
          isThrottled = true;
          setTimeout(() => {
            isThrottled = false;
          }, 200);
        }
      });
      
      // 初始加载
      loadMoreMusic();
    });
  </script>
</body>
</html>
