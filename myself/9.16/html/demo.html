<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;box-sizing: border-box;list-style:none;}
        .box{margin: 60px 0 0 100px;text-align: center;}
        .list{width: 100px;border: 1px solid gray;height: auto;background: rgb(220, 216, 216,.4);}
        .list>li{height: 50px;width: 100px;border: 0;line-height: 40px;cursor: pointer;}
        .opacity{opacity: 1;background: gray;color: white;}
    </style>
</head>
<body>
    <div id="box" class="box">
    <ul class="list">
        <li class="opacity">角色</li>
        <li>武器</li>
        <li>遗器</li>
        <li>详情</li>
        <li>人物简介</li>
    </ul>
</div>
<script>
    // 获取所有的li
    var li=Array.from(document.querySelectorAll('.list li'))
    // 循环遍历拿到每个li
    li.forEach(function(li){
        // 给每个li绑定点击或者鼠标滑过事件
        // li.onclick=function(){//点击
            li.onmouseover=function(){//滑过 mouseover
            // 排他 干掉别人 保留自己
            var opacity=document.querySelector('.opacity')
            // 声明高亮变量为类名opacity的
            opacity.classList.remove('opacity')
            this.classList.add('opacity')
        }
    })
</script>
</body>
</html>
