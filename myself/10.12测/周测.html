<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="./css/周测.css">

<body>
    <div class="box">
        <div class="box1">
            <h2>popup.alert</h2>
            <button class="tit">用法一 默认标题</button>
            <button class="con">用法二 自定义标题和内容</button>
        </div>
        <div class="box2">
            <h2>popup.confirm</h2>
            <button class="btn">用法一 默认按钮</button>
            <button class="event">用法二 自定义按钮文字和事件</button>
        </div>
        <div class="box3">
            <h2>popup.msg</h2>
            <button class="set">用法一 默认样式 2s后自动关闭</button>
            <button class="pic">用法二 设置图标</button>
            <button class="close">用法三 自定义关闭时间</button>
        </div>
        <div class="box4">
            <h2>popup.load</h2>
            <button class="load">展示loading</button>
        </div>

    </div>
    <div class="tip">
        <div class="cont">
            <span class="false">&times;</span>
            <div class="hn"></div>
            <div class="body"></div>
            <button class="ok1">确定</button>
        </div>
    </div>
    <div class="tip1">
        <div class="cont">
            <span class="false">&times;</span>
            <div class="hn"></div>
            <div class="body"></div>
            <button class="ok2">确定</button>
            <button class="default">取消</button>
        </div>
    </div>
    <div class="tip2">
        <div class="cont">
            <span class="false">&times;</span>
            <div class="hn"></div>
            <div class="body"></div>
            <button class="yes">yes</button>
            <button class="no">no</button>
        </div>
    </div>
    <div class="tip3">
        <div class="nr"></div>
    </div>
    <div class="tip4">
        <div class="nr"></div>
    </div>
    <div class="loading">

            <span></span>
