<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(n){
            document.write('<ul>')
        for(var i=1;i<=n;i++){
            document.write('<li>')
            for(var j=1;j<=i;j++){
                document.write('<span>'+i+'*'+j+'='+i*j+'</span>')
            }
            document.write('</li>')
        }
        document.write('</ul>')
    }
    add(9)
    </script>
</body>
</html>
