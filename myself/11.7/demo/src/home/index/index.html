<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="box">
        <header>
            <img src="../../img/天气.png" alt="">
            <h1>免费天气查询</h1>
        </header>
        <main>
            <nav>
                <div class="autoSearch">
                    <input type="text" class="inp" placeholder="请输入要查询的城市">
                    <button class="search">查询天气</button>
                </div>
                <div class="default">
                    <div class="city-item city-1">北京</div>
                    <div class="city-item city-2">上海</div>
                    <div class="city-item city-3">广州</div>
                    <div class="city-item city-4">深圳</div>
                    <div class="city-item city-5">纽约</div>
                    <div class="city-item city-6">伦敦</div>
                    <div class="city-item city-7">东京</div>
                    <div class="city-item city-8">巴黎</div>
                </div>
                <div class="tip">提示：可以搜索全球任意城市，支持英文名称</div>
                <div class="history">
                    <div class="history-title">搜索历史</div>
                    <div class="history-list"></div>
                </div>
            </nav>
            <section>
                <div class="box1">
                    <div class="city">北京</div>
                    <div class="temperature"><span>9</span>℃</div>
                    <div class="weather">雨</div>
                </div>
                <div class="detail">
                    <div class="bodytemp detail-item">
                        <div class="title">体感温度</div>
                        <div class="value"><span>9</span>℃</div>
                    </div>
                    <div class="windspeed detail-item">
                        <div class="title">风速</div>
                        <div class="value"><span>2</span>km/h</div>
                    </div>
                    <div class="wind detail-item">
                        <div class="title">风向</div>
                        <div class="value"><span>西北</span></div>
                    </div>
                    <div class="updatetime detail-item">
                        <div class="title">更新时间</div>
                        <div class="value"><span>10:00:00</span></div>
                    </div>
                </div>
            </section>
            <div class="day-detail">
                <div class="box2">
                    <div class="title">7天天气预报</div>
                </div>
                <div class="day">
                    <div class="day-item">
                        <div class="date">2023-11-07</div>
                        <div class="weather">雨</div>
                        <div class="temp">
                            <div class="temperature-min"><span>9</span>℃</div>/
                            <div class="temperature-max"><span>12</span>℃</div>
                        </div>
                    </div>
                    <div class="day-item">
                        <div class="date">2023-11-07</div>
                        <div class="weather">雨</div>
                        <div class="temp">
                            <div class="temperature-min"><span>9</span>℃</div>/
                            <div class="temperature-max"><span>12</span>℃</div>
                        </div>
                    </div>
                    <div class="day-item">

                        <div class="weather">雨</div>
                        <div class="temp">
                            <div class="temperature-min"><span>9</span>℃</div>/
                            <div class="temperature-max"><span>12</span>℃</div>
                        </div>
                    </div>
                    <div class="day-item">
                        <div class="date">2023-11-07</div>
                        <div class="weather">雨</div>
                        <div class="temp">
                            <div class="temperature-min"><span>9</span>℃</div>/
                            <div class="temperature-max"><span>12</span>℃</div>
                        </div>
                    </div>
                    <div class="day-item">

                            <div class="temperature-max"><span>12</span>℃</div>
                        </div>
                    </div>
                    <div class="day-item">

                            <div class="temperature-max"><span>12</span>℃</div>

                    </div>

                    </div>
                </div>
                <div class="echarts"></div>
            </div>
        </main>
    </div>
