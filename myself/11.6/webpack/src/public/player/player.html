<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="bg"></div>
    <main>
        <div class="player-wrap">
            <div class="player">
                <div class="mask play">
                    <div class="mask-pic">
                        <img>
                    </div>
                </div>
                <div class="pause">
                    <img src="https://p6.music.126.net/obj/wonDlsKUwrLClGjCm8Kx/34207669669/f020/7908/a749/34315097c835773c4e003e72fbbae607.png"
                       >
                </div>
            </div>
        </div>
        <div class="name-box">
            <div class="names">
                <div class="song-name">歌名<span></span></div>
                <div class="name">歌手名字</div>
            </div>
            <div class="like"><img
                    src="https://p5.music.126.net/obj/wonDlsKUwrLClGjCm8Kx/34185429084/3f1f/9f48/8283/b280e70992f990c78fc7219860e42baa.png"
                   ><span></span></div>
            <div class="comment"><img
                    src="https://p5.music.126.net/obj/wonDlsKUwrLClGjCm8Kx/34185427417/5b4d/c1b5/0d71/6863eb61cfe5f6218de37af944d64aee.png"
                   ><span></span></div>
        </div>
        <div class="lyric">
        </div>
        <div class="play-rate"></div>
        <div class="progress">
            <div class="time start">00:00</div>
            <div class="progress-item">
                <div class="line">
                    <div class="heiht-line"></div>
                </div>
            </div>
            <div class="time end">00:00</div>
        </div>
        <section>
            <div class="tab active comment">评论区</div>
            <div class="tab liked-song">相似歌曲</div>
            <div class="tab liked-list">相似歌单</div>
        </section>
        <audio></audio>
    </main>

</body>

</html>
