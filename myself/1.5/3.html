<!DOCTYPE html>
<html lang="en">
  <head>

      .box {
        display: flex;
        flex-flow: row wrap;
        width: 400px;
        height: 200px;
        border: 2px solid #000;
        align-content:space-evenly;
      }

        height: 60px;
        background: #ff9800;
        margin: 5px;
      }

  <body>
    <div class="box">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
