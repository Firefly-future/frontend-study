<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* .box{
      display: flex;
      align-items: center;
      justify-content: center;
    } */
      .box {
        position: relative;
        width: 600px;
        height: 600px;  
        background-color: antiquewhite;
      }
      .item {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="item">1</div>
    </div>
  </body>
