<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box1 .left {
        float: left;
        width: 100px;
        height: 200px;
        background-color: aqua;
      }
      .box1 .right {
        overflow: hidden;
        height: 100px;
        background-color: #ccc;
      }
      .box1:after {
        content: 'dsafdasfafdsafads';
        /* height: 0;
        line-height: 0; */
        display: block;
        /* visibility: hidden; */
        clear: both;
      }
      .box2 {
        margin-top: 20px;
      }
      .box2 .left {
        float: left;
        width: 100px;
        height: 200px;
        background-color: #ccc;
      }
      .box2 .right {
        background-color: #ddd;
        height: 100px;
        margin-left: 100px;
      }
      .box2:after {
        content: '';
        height: 0;
        line-height: 0;
        display: block;
        visibility: hidden;
        clear: both;
      }
      .box3 {
        position: relative;
        margin-top: 20px;
      }
      .box3 .left {
        position: absolute;
        left: 0;
        top: 0;
        background-color: #ccc;
        width: 100px;
        height: 200px;
      }
      .box3 .right {
        margin-left: 100px;
        background-color: #ddd;
        height: 100px;
      }

      .box4 {
        font-size: 0;
        margin-top: 120px;
      }
      .box4 .left {
        width: 100px;
        background-color: #ccc;
        height: 200px;
      }
      .box4 .left,
      .box4 .right {
        display: inline-block;
        font-size: 16px;
        vertical-align: top;
      }
      .box4 .right {
        width: calc(100% - 100px);
        background-color: #ddd;
        height: 100px;
      }
      .box5{
        margin-top: 20px;
        display: flex;
      }
      .box5 .left{
        width: 100px;
        background-color: #ccc;
        height: 200px;
      }
      .box5 .right{
        flex: 1;
        background-color: #ddd;
      }
      .box6{
        margin-top: 20px;
        display: table;
        width: 100vw;
      }
      .box6 .left,.box6 .right{
        display: table-cell;
      }
      .box6 .left{
        background-color: #ccc;
        height: 200px;
      }
      .box6 .right{
        background-color: #ddd;
        height: 100px;
      }

    </style>
  </head>
  <body>
    <!-- 左侧固定，右侧自适应排版 -->
    <div class="box1">
      <div class="left"></div>
      <div class="right"></div>
    </div>
    <div>asjfosdjogjoisdagoi</div>
    <div class="box2">
      <div class="left"></div>
      <div class="right"></div>
    </div>
    <div class="box3">
      <div class="left"></div>
      <div class="right"></div>
    </div>
    <div class="box4">
      <div class="left"></div>
      <div class="right"></div>
    </div>
    <div class="box5">
      <div class="left"></div>
      <div class="right"></div>
    </div>
    <div class="box6">
      <div class="left"></div>
      <div class="right"></div>
    </div>
  </body>
</html>
