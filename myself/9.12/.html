            var num1=1000000
            var num2=100000000000
            var num3=1231354616159
            var num4=-123
            function san(num){
                
                if(num<0){
                    num=String(num)
                    num.length=num.length-1
            }
                else{num=num.toString()}
                
                n=parseInt(num.length/3);
                if(parseInt(num.length/3)===num.length/3){
                    n=n-1
                }
                var Num='';
                for(var i=n-1;i>=1;i--){
                    Num+=','+num.slice(-3*(i+1),-3*i);
                }return num.substr(0,num.length-3*n)+Num+','+num.slice(-3)
            }
            console.log(san(num1))
            console.log(san(num2))
            console.log(san(num3))
            console.log(san(num4))
