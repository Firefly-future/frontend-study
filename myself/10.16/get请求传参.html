<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" placeholder="请输入歌手 歌名">
    <ul></ul>
    <script>

        document.querySelector('input').addEventListener('keydown', e => {
            if (e.keyCode === 13) {
                const xhr = new XMLHttpRequest()
                xhr.open("get", `http://39.96.210.90:5001/search?keywords=${e.target.value}&limit=10`)
                xhr.onreadystatechange = () => {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            const data = JSON.parse(xhr.responseText)
                            document.querySelector('ul').innerHTML = data.result.songs.map(item => {
                                return `<li>${item.name}</li>`
                            }).join('')
                        } else { alert('请稍后重试') }
                    }
                }
                xhr.send()
            }
        })
    </script>
</body>

</html>
