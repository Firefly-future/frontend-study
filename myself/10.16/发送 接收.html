<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul></ul>
    <script>
        const xhr=new XMLHttpRequest()
        xhr.open('get','http://39.96.210.90:5001/banner')
        xhr.onreadystatechange=()=>{
            if(xhr.readyState===4){
                if(xhr.status===200){
                    const data=JSON.parse(xhr.responseText)
                    document.querySelector('ul').innerHTML=data.banners.map(item=>{
                        return `
                        <li>
                            <img src='${item.bigImageUrl}' width='300'/>
                            <img src='${item.imageUrl}' width='300' />    
                        </li>
                        `                        
                    }).join('')
                }
            }
        }
        xhr.send()
    </script>
</body>
</html>
